[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "parsefabric"
version = "1.0.0"
description = "Async, composable parsers that turn logs, JSON, command output and mixed text into structured events with traceable, losslessly aggregated evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "S MUNI HARISH", email = "samamuniharish@gmail.com" },
]
keywords = [
  "parsing",
  "logs",
  "provenance",
  "evidence",
  "streaming",
  "asyncio",
  "mixed-content",
  "observability",
  "opentelemetry",
  "llm",
  "langchain",
  "langgraph",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Logging",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = [
  "jc>=1.26.2,<2",
  "opentelemetry-api>=1.45.2,<2",
  "pydantic>=2.14.3,<3",
  "structlog>=26.1.0",
  "tree-sitter>=0.26.0,<1",
  "tree-sitter-language-pack>=1.25.0,<2",
  "typing-extensions>=4.16.0,<5",
]

[project.optional-dependencies]
langchain = ["langchain-core>=1.7.6,<2"]
all = ["parsefabric[langchain]"]

[project.urls]
Homepage = "https://github.com/smuniharish/parsefabric"
Documentation = "https://parsefabric.readthedocs.io/"
Changelog = "https://github.com/smuniharish/parsefabric/blob/main/CHANGELOG.md"
Issues = "https://github.com/smuniharish/parsefabric/issues"
Repository = "https://github.com/smuniharish/parsefabric"

[dependency-groups]
test = [
  "hypothesis>=6.170.15",
  "opentelemetry-sdk>=1.45.2,<2",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-cov>=7.1.0",
  "skills-ref>=0.1.1,<1",
]
lint = ["ruff>=0.17.4"]
types = ["pyrefly>=1.4.1"]
docs = [
  "griffe-pydantic>=1.3.2,<2",
  "mkdocstrings-python>=2.0.10,<3",
  "zensical>=0.1.0,<0.2",
]
celery = ["celery[redis]>=5.7.0,<6"]
examples = [
  { include-group = "celery" },
  "langchain>=1.4.9,<2",
  "langgraph>=1.2.20,<2",
  "openai>=3.46.0,<4",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
  "opentelemetry-sdk>=1.45.2,<2",
  "sqlglot>=30.30.0,<31",
  "streamlit>=1.67.0,<2",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "types" },
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "parsefabric"
source-exclude = ["**/__pycache__/**"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = [".", "examples"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
  "error",
  # langchain-core (the `langchain` extra and the `examples` group) pulls in langsmith, whose
  # auto-loaded pytest plugin calls asyncio.iscoroutinefunction at import; Python 3.14+ warns.
  "ignore:'asyncio.iscoroutinefunction':DeprecationWarning:langsmith",
]
markers = [
  "live: calls a real OpenAI-compatible model; requires the PARSEFABRIC_LLM_* environment variables",
  "slow: long-running soak, load or endurance checks",
  "examples: tests that execute the scripts under examples/",
]

[tool.coverage.run]
branch = true
source = ["parsefabric"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FURB",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TC",
  "UP",
  "W",
]
# Google style documents constructor arguments on the class, not on __init__.
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["A002", "ARG", "D", "S101", "S105", "S106", "S108", "S301", "S603", "PT011"]
"examples/**/*.py" = ["ARG", "D", "T201", "S603"]
"benchmarks/**/*.py" = ["ARG", "D", "T201", "S603"]
"scripts/**/*.py" = ["ARG", "D", "T201", "S603"]
"parsefabric-skills/**/scripts/*.py" = ["ARG", "D", "T201", "S603"]
"parsefabric-skills/**/assets/*.py" = ["ARG", "D"]
"parsefabric-skills/**/assets/test_*.py" = ["ARG", "D", "S101"]
"parsefabric-skills/**/evals/files/**/*.py" = ["D"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "typing.TypedDict"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["parsefabric", "examples", "benchmarks", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyrefly]
project-includes = ["src", "tests", "examples", "benchmarks", "scripts", "parsefabric-skills"]
search-path = ["src", "examples", ".", "parsefabric-skills/skills/parsefabric-extend/assets"]
