# Documentation site, built with Zensical: `uv run zensical build --strict`.
# Preview locally with `uv run zensical serve`.

[project]
site_name = "ParseFabric"
site_description = "Composable parsers that turn logs, JSON, command output and mixed text into structured events with traceable, losslessly aggregated evidence."
site_url = "https://parsefabric.readthedocs.io/en/latest/"
site_author = "S MUNI HARISH"
repo_name = "smuniharish/parsefabric"
repo_url = "https://github.com/smuniharish/parsefabric"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 S MUNI HARISH &middot; Apache License 2.0"
extra_css = ["assets/stylesheets/extra.css"]

